[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-arch"
version = "0.1.0"
description = "A living architecture map for your project — define the intended structure, track what's built, and see what's next."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
atlas = "atlas.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["atlas"]